name: keep-warm

# Pings the Render free-tier backend every ~12 minutes so the dyno
# never crosses the 15-min idle threshold that triggers a cold-start
# spin-down. Render's "/" route is a tiny health check (~50 ms response)
# so this costs effectively nothing on either side.
#
# Notes:
# - GitHub Actions cron runs on shared infrastructure with 5-15 min
#   jitter under load; 12 min interval gives some headroom.
# - workflow_dispatch lets you trigger a manual ping from the Actions tab.
# - GitHub auto-disables scheduled workflows in repos that go 60 days
#   without any commit; push or hit the manual trigger occasionally.

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          set -e
          URL="https://conhacks2026.onrender.com/"
          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $URL"
            if curl -fsS --max-time 60 "$URL" > /tmp/body.txt; then
              echo "OK"
              cat /tmp/body.txt
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          # Render free can be cold for up to ~60s on the first ping after
          # a long idle. Don't fail the workflow -- the next scheduled run
          # will catch up. We log a clear message so the run is still useful.
          echo "All attempts failed, will retry on next scheduled run."
